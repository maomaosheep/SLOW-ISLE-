<div class="drawer-shade"><a class="drawer-backdrop" href="{% url close_url %}" aria-label="关闭编辑"></a><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-header"><div><div class="eyebrow">MADE WITH CARE</div><h2 id="drawer-title">{{ drawer_title }}</h2></div><a class="close-button" href="{% url close_url %}" aria-label="关闭编辑">×</a></header><form method="post" enctype="multipart/form-data" class="editor-form">{% csrf_token %}<div class="drawer-fields">{{ edit_form.non_field_errors }}{% for field in edit_form %}<div class="form-field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}<label>{{ field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}</label>{{ field }}{% endif %}{{ field.errors }}{% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}</div>{% endfor %}</div><footer class="drawer-footer"><a class="button" href="{% url close_url %}">取消</a><button class="button primary" type="submit">保存{% if section == 'products' %}商品{% else %}分类{% endif %} ↗</button></footer></form></section></div>
