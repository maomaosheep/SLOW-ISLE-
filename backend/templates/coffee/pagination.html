{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="翻页">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&category={{ selected_category|urlencode }}&availability={{ availability|urlencode }}&status={{ status|urlencode }}&page={{ page.previous_page_number }}">← 上一页</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&category={{ selected_category|urlencode }}&availability={{ availability|urlencode }}&status={{ status|urlencode }}&page={{ page.next_page_number }}">下一页 →</a>{% endif %}</nav>{% endif %}
